worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Never log query strings: download capabilities are intentionally carried in
    # short-lived query parameters and must not be copied into access logs.
    log_format main '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    large_client_header_buffers 2 8k;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=expensive:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_conn_zone $binary_remote_addr zone=upload_ip:10m;

    # Docker service addresses can change whenever Compose recreates a
    # container. Re-resolve them through Docker's embedded DNS instead of
    # pinning the address that existed when nginx started.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream gateway_backend {
        zone gateway_backend 64k;
        server gateway:4000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    upstream dashboard_backend {
        zone dashboard_backend 64k;
        server dashboard:3000 resolve max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    upstream media_backend {
        zone media_backend 64k;
        server media:4103 resolve max_fails=2 fail_timeout=10s;
        keepalive 8;
    }

    upstream finance_backend {
        zone finance_backend 64k;
        server finance:4105 resolve max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    upstream distribution_backend {
        zone distribution_backend 64k;
        server distribution:4104 resolve max_fails=2 fail_timeout=10s;
        keepalive 4;
    }

    proxy_http_version 1.1;
    # Preserve an allow-listed custom Host. EDGE_SERVER_NAMES and the mounted
    # certificate are managed by the external DNS/TLS control plane.
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID "";
    proxy_set_header X-BeAlpha-Context "";
    proxy_set_header X-Tenant-Id "";
    proxy_set_header X-User-Id "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # ── HTTP (dev access from any device without SSL cert issues) ──
    server {
        listen 8080 default_server;
        server_name _;

        location = /health/live {
            proxy_pass http://gateway_backend;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://gateway_backend;
        }

        location /media-upload/ {
            client_max_body_size 50g;
            client_body_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://media_backend;
        }

        location /media-stream/ {
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_pass http://media_backend;
        }

        location /media-public/ {
            proxy_pass http://media_backend;
        }

        location / {
            proxy_pass http://dashboard_backend;
            proxy_read_timeout 60s;
            proxy_hide_header Content-Security-Policy;
        }
    }

    # server {
    #     listen 8443 ssl default_server;
    #     server_name _;
    #
    #     ssl_reject_handshake on;
    # }

    server {
        listen 8443 ssl default_server;
        server_name ${EDGE_SERVER_NAMES};

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        limit_conn per_ip 20;
        proxy_intercept_errors on;
        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @gateway_unavailable;

        location /health/ {
            proxy_pass http://gateway_backend;
            proxy_read_timeout 5s;
        }

        location ~ ^/api/v1/auth/(login|refresh|2fa/verify)$ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://gateway_backend;
        }

        location ~ ^/api/v1/(distribution|finance)/ {
            limit_req zone=expensive burst=5 nodelay;
            proxy_pass http://gateway_backend;
        }

        location /media-upload/ {
            limit_conn upload_ip 2;
            limit_except PUT { deny all; }
            client_max_body_size 50g;
            client_body_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://media_backend;
        }

        location /media-stream/ {
            limit_conn upload_ip 4;
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 30s;
            proxy_pass http://media_backend;
        }

        location /media-public/ {
            limit_except GET { deny all; }
            proxy_buffering on;
            proxy_read_timeout 30s;
            proxy_pass http://media_backend;
        }

        location /finance-upload/ {
            limit_conn upload_ip 2;
            limit_except PUT { deny all; }
            client_max_body_size 50g;
            client_body_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://finance_backend;
        }

        location /distribution-export/ {
            limit_conn upload_ip 2;
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 30s;
            proxy_pass http://distribution_backend;
        }

        location /vevo-package/ {
            limit_conn upload_ip 2;
            limit_except GET { deny all; }
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 30s;
            proxy_pass http://distribution_backend;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://gateway_backend;
        }

        location / {
            proxy_pass http://dashboard_backend;
            proxy_read_timeout 60s;
            # Next.js 16 auto-generates a nonce-based CSP header that breaks
            # when served behind a reverse proxy. Strip it at the edge.
            proxy_hide_header Content-Security-Policy;
        }

        location @payload_too_large {
            default_type application/json;
            return 413 '{"data":null,"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body exceeds edge limit"},"requestId":"$request_id"}';
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"data":null,"error":{"code":"RATE_LIMITED","message":"Request rate limit exceeded"},"requestId":"$request_id"}';
        }

        location @gateway_unavailable {
            default_type application/json;
            return 503 '{"data":null,"error":{"code":"UPSTREAM_UNAVAILABLE","message":"Gateway unavailable"},"requestId":"$request_id"}';
        }
    }
}
