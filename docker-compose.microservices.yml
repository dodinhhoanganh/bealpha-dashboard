    image: bealpha-nginx:local
    build:
      context: .
      dockerfile: gateway/nginx.Dockerfile
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
      gateway:
        condition: service_healthy
      media:
        condition: service_healthy
      finance:
        condition: service_healthy
    environment:
      EDGE_SERVER_NAMES: ${EDGE_SERVER_NAMES:-localhost 127.0.0.1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        envsubst '$${EDGE_SERVER_NAMES}' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    user: "101:101"
    ports:
      - ${EDGE_HTTP_PORT:-80}:8080
      - ${EDGE_HTTPS_PORT:-443}:8443
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
