      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      GATEWAY_INTERNAL_CONTEXT_PUBLIC_KEY_B64: ${GATEWAY_INTERNAL_CONTEXT_PUBLIC_KEY_B64:?GATEWAY_INTERNAL_CONTEXT_PUBLIC_KEY_B64 must be set}
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging

volumes:
  microservices_postgres_data:
  microservices_redis_data:
  microservices_media_data:
  microservices_catalog_imports:
  microservices_distribution_packages:
  microservices_finance_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  migration:
    driver: bridge
