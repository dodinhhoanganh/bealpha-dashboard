name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/bealpha

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dashboard, context: ./bealpha-dashboard, dockerfile: ./bealpha-dashboard/Dockerfile }
          - { name: gateway, context: ., dockerfile: ./services/gateway/Dockerfile }
          - { name: identity, context: ., dockerfile: ./services/identity/Dockerfile }
          - { name: catalog, context: ., dockerfile: ./services/catalog/Dockerfile }
          - { name: media, context: ., dockerfile: ./services/media/Dockerfile }
          - { name: distribution, context: ., dockerfile: ./services/distribution/Dockerfile }
          - { name: finance, context: ., dockerfile: ./services/finance/Dockerfile }
          - { name: notifications, context: ., dockerfile: ./services/notifications/Dockerfile }
          - { name: analytics, context: ., dockerfile: ./services/analytics/Dockerfile }
          - { name: audit, context: ., dockerfile: ./services/audit/Dockerfile }
          - { name: migrations, context: ., dockerfile: ./Dockerfile.migrations }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then version="$INPUT_VERSION"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "Invalid version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
