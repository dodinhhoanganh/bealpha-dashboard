name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  services:
    name: Services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/contracts/package-lock.json
            services/*/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build contracts
        run: npm --prefix packages/contracts run build
      - name: Typecheck
        run: npm run typecheck
      - name: Install DDEX schema validator
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Test
        env:
          DISTRIBUTION_ERN_XSD_PATH: ${{ github.workspace }}/ddex/official/ern-4.3.2/release-notification.xsd
          DISTRIBUTION_ACK_XSD_PATH: ${{ github.workspace }}/ddex/official/ern-c-sftp-18.1/ern-choreography-sftp.xsd
          XML_CATALOG_FILES: ${{ github.workspace }}/ddex/official/ern-4.3.2/catalog.xml ${{ github.workspace }}/ddex/official/ern-c-sftp-18.1/catalog.xml
        run: npm test
      - name: Build
        run: npm run build
      - name: Check migrations
        run: npm run typecheck:migrations && npm run test:migrations
      - name: Audit production dependencies
        run: npm run audit:prod

  dashboard:
    name: Dashboard UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bealpha-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bealpha-dashboard/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit --incremental false
      - name: Test
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  compose:
    name: Compose Static Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.microservices.example .env.microservices
      - run: cp .env.migration.example .env.migration
      - run: docker compose --env-file .env.microservices --env-file .env.migration config --quiet
